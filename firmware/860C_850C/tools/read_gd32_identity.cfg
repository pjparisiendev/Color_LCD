# READ-ONLY GD32F10x identification helper.
# Use only after tracing SWD pads and establishing a safe target-power scheme.
# This script does not erase, unlock, program flash or modify option bytes.

init
reset halt

echo "GD32/STM32-compatible debug identification register:"
mdw 0xE0042000 1

echo "GD32 factory memory-density word (SRAM KiB high half, flash KiB low half):"
mdw 0x1FFFF7E0 1

echo "Expected candidates: RCT6=0x00300100, RET6=0x00400200"
shutdown
